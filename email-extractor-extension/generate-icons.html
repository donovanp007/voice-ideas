<!DOCTYPE html>
<html>
<head>
  <title>Generate Extension Icons</title>
  <style>
    body { font-family: system-ui; padding: 40px; background: #1a1a2e; color: white; }
    h1 { color: #00d4ff; }
    .icons { display: flex; gap: 20px; flex-wrap: wrap; margin: 20px 0; }
    .icon-box { text-align: center; }
    canvas { border: 1px solid #333; border-radius: 8px; }
    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #00d4ff, #0099cc);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }
    button:hover { opacity: 0.9; }
    .instructions { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 8px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Email Extractor - Icon Generator</h1>
  <p>Click buttons below to download PNG icons for the extension.</p>

  <div class="icons" id="icons"></div>

  <div>
    <button onclick="downloadAll()">Download All Icons</button>
  </div>

  <div class="instructions">
    <h3>Instructions:</h3>
    <ol>
      <li>Click "Download All Icons" or download individually</li>
      <li>Move the downloaded PNG files to the <code>icons/</code> folder</li>
      <li>Reload the extension in Chrome</li>
    </ol>
  </div>

  <script>
    const sizes = [16, 32, 48, 128];
    const container = document.getElementById('icons');

    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      const scale = size / 128;

      // Background
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, size * 0.18);
      ctx.fill();

      // Gradient overlay
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, 'rgba(0, 212, 255, 0.2)');
      gradient.addColorStop(1, 'rgba(123, 44, 191, 0.2)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.roundRect(size * 0.06, size * 0.06, size * 0.88, size * 0.88, size * 0.15);
      ctx.fill();

      // Email envelope
      ctx.strokeStyle = '#00d4ff';
      ctx.lineWidth = Math.max(2, size * 0.03);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const ex = size * 0.15;
      const ey = size * 0.25;
      const ew = size * 0.7;
      const eh = size * 0.5;

      // Envelope body
      ctx.beginPath();
      ctx.roundRect(ex, ey, ew, eh, size * 0.05);
      ctx.stroke();

      // Envelope flap (V shape)
      ctx.beginPath();
      ctx.moveTo(ex + size * 0.03, ey + size * 0.05);
      ctx.lineTo(ex + ew / 2, ey + eh * 0.55);
      ctx.lineTo(ex + ew - size * 0.03, ey + size * 0.05);
      ctx.stroke();

      // @ symbol circle
      const cx = size * 0.78;
      const cy = size * 0.78;
      const cr = size * 0.16;

      ctx.fillStyle = '#00d4ff';
      ctx.beginPath();
      ctx.arc(cx, cy, cr, 0, Math.PI * 2);
      ctx.fill();

      // @ symbol
      ctx.fillStyle = '#1a1a2e';
      ctx.font = `bold ${size * 0.18}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('@', cx, cy + size * 0.01);
    }

    // Create canvases for each size
    sizes.forEach(size => {
      const box = document.createElement('div');
      box.className = 'icon-box';

      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      canvas.id = `icon${size}`;
      drawIcon(canvas, size);

      const label = document.createElement('p');
      label.textContent = `${size}x${size}`;

      const btn = document.createElement('button');
      btn.textContent = 'Download';
      btn.onclick = () => downloadIcon(size);

      box.appendChild(canvas);
      box.appendChild(label);
      box.appendChild(btn);
      container.appendChild(box);
    });

    function downloadIcon(size) {
      const canvas = document.getElementById(`icon${size}`);
      const link = document.createElement('a');
      link.download = `icon${size}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function downloadAll() {
      sizes.forEach((size, i) => {
        setTimeout(() => downloadIcon(size), i * 200);
      });
    }
  </script>
</body>
</html>
